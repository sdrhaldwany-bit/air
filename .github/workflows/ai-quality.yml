name: Ghost AI quality files

on:
  push:
    paths:
      - "chat.mjs"
      - "api/chat.mjs"
      - "ai-training/**"
      - ".github/workflows/ai-quality.yml"
  pull_request:
    paths:
      - "chat.mjs"
      - "api/chat.mjs"
      - "ai-training/**"
      - ".github/workflows/ai-quality.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check chat.mjs
          node --check api/chat.mjs
      - name: Validate JSONL datasets
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          for (const file of ["ai-training/evaluation.jsonl", "ai-training/seed-examples.jsonl"]) {
            const rows = readFileSync(file, "utf8").trim().split(/\r?\n/);
            for (const [i, row] of rows.entries()) {
              const value = JSON.parse(row);
              if (!value || typeof value !== "object") throw new Error(file + ":" + (i + 1));
            }
            console.log(file + ": " + rows.length + " valid rows");
          }'
