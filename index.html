<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoRestrictions AI</title>

<style>
:root {
    --bg:#090b10;
    --panel:#11151e;
    --card:#171d29;
    --border:#252d3b;
    --text:#f1f5f9;
    --muted:#929bad;
    --accent:#7c5cff;
    --green:#24d18b;
    --red:#ff5d70;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
    height:100dvh;
    overflow:hidden;
}

button,input,textarea {
    font:inherit;
}

button {
    cursor:pointer;
}

.app {
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:1100px;
    margin:auto;
    border-inline:1px solid var(--border);
}

header {
    height:65px;
    flex-shrink:0;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.brand {
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
    font-size:18px;
}

.logo {
    width:38px;
    height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,#805dff,#4930c9);
    display:grid;
    place-items:center;
    font-weight:bold;
}

.header-actions {
    display:flex;
    align-items:center;
    gap:8px;
}

.status {
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
}

.dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
}

.dot.online {
    background:var(--green);
}

.icon-btn {
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:10px;
}

.chat {
    flex:1;
    overflow-y:auto;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    gap:18px;
    scroll-behavior:smooth;
}

.welcome {
    text-align:center;
    margin:auto;
    max-width:420px;
    color:var(--muted);
    line-height:1.8;
}

.welcome h2 {
    color:var(--text);
}

.message {
    display:flex;
    flex-direction:column;
    max-width:min(85%,650px);
    gap:6px;
}

.message.user {
    align-self:flex-start;
}

.message.assistant {
    align-self:flex-end;
}

.message-label {
    font-size:11px;
    color:var(--muted);
}

.bubble {
    padding:13px 15px;
    border-radius:15px;
    line-height:1.7;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.user .bubble {
    background:#29214c;
    border:1px solid #443477;
    border-bottom-left-radius:4px;
}

.assistant .bubble {
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom-right-radius:4px;
}

.bubble pre {
    direction:ltr;
    text-align:left;
    overflow-x:auto;
    background:#080a0e;
    padding:12px;
    border-radius:8px;
}

.typing {
    color:var(--muted);
    font-size:13px;
}

.task-info {
    font-size:12px;
    color:var(--muted);
    padding:8px;
}

.composer {
    flex-shrink:0;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:12px;
}

.options {
    display:flex;
    gap:15px;
    margin-bottom:10px;
    color:var(--muted);
    font-size:12px;
}

.options label {
    display:flex;
    align-items:center;
    gap:5px;
}

.input-row {
    display:flex;
    align-items:flex-end;
    gap:9px;
}

textarea {
    flex:1;
    min-height:48px;
    max-height:150px;
    resize:none;
    border:1px solid var(--border);
    background:#0c1018;
    color:var(--text);
    border-radius:13px;
    padding:13px;
    outline:none;
    line-height:1.5;
}

textarea:focus {
    border-color:var(--accent);
}

.send-btn {
    height:48px;
    min-width:52px;
    border:0;
    border-radius:13px;
    color:white;
    background:var(--accent);
    font-size:19px;
}

.send-btn:disabled {
    opacity:.5;
    cursor:not-allowed;
}

.modal {
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:10;
}

.modal.show {
    display:flex;
}

.modal-box {
    width:100%;
    max-width:470px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
    max-height:90dvh;
    overflow-y:auto;
}

.modal-box h2 {
    margin-top:0;
}

.modal-box p {
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

.modal-box input {
    width:100%;
    background:#090d14;
    color:white;
    border:1px solid var(--border);
    padding:12px;
    border-radius:9px;
    margin:8px 0;
    direction:ltr;
}

.modal-box textarea {
    width:100%;
    min-height:85px;
    direction:ltr;
    font-size:12px;
}

.primary-btn {
    background:var(--accent);
    color:white;
    border:0;
    padding:11px 15px;
    border-radius:10px;
}

.secondary-btn {
    background:var(--card);
    color:white;
    border:1px solid var(--border);
    padding:11px 15px;
    border-radius:10px;
}

.danger-btn {
    background:#4a1c28;
    color:#ff9ba7;
    border:1px solid #71303d;
    padding:11px 15px;
    border-radius:10px;
}

.modal-actions {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.notice {
    color:var(--muted);
    font-size:11px;
    margin-top:10px;
    line-height:1.6;
}

@media(max-width:600px) {
    .message {
        max-width:94%;
    }

    header {
        padding:0 10px;
    }

    .brand {
        font-size:15px;
    }

    .status {
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="brand">
        <div class="logo">NR</div>
        <span>NoRestrictions AI</span>
    </div>

    <div class="header-actions">
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">غير متصل</span>
        </div>
        <button class="icon-btn" id="deviceButton">الجهاز</button>
    </div>
</header>

<main class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h2>مرحباً بك 👋</h2>
        <p>
            NoRestrictions AI<br>
            اكتب رسالتك للبدء.
        </p>
    </div>
</main>

<footer class="composer">

    <div class="options">
        <label>
            <input type="checkbox" id="autoStatus" checked>
            مراقبة الاتصال
        </label>

        <label>
            <input type="checkbox" id="turboMode">
            تحديث أسرع
        </label>
    </div>

    <div class="input-row">
        <textarea
            id="messageInput"
            placeholder="اكتب رسالتك هنا..."
            rows="1"></textarea>

        <button class="send-btn" id="sendButton">➤</button>
    </div>
</footer>

</div>

<!-- نافذة الجهاز -->

<div class="modal" id="deviceModal">
    <div class="modal-box">

        <h2>ربط جهاز Termux</h2>

        <p>
            اربط جهازك لتتمكن من تنفيذ العمليات المسموحة
            واستقبال نتائجها داخل المحادثة.
        </p>

        <div id="deviceDetails"></div>

        <div class="modal-actions">
            <button class="primary-btn" id="pairButton">
                إنشاء مفتاح وربط الجهاز
            </button>

            <button class="secondary-btn" id="closeModal">
                إغلاق
            </button>

            <button class="danger-btn" id="unpairButton">
                إلغاء الربط
            </button>
        </div>

        <div class="notice">
            لا تشارك مفتاح الجهاز مع أي شخص.
        </div>

    </div>
</div>

<script>
"use strict";

/* إعدادات الاتصال */

const API = "https://norestrictions-api.sdrhaldwane.workers.dev";
const CHAT_API = API + "/api/chat";

const HISTORY_KEY = "nr-chat-history";
const DEVICE_KEY = "nr-device-key";

/* العناصر */

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const modal = document.getElementById("deviceModal");
const deviceDetails = document.getElementById("deviceDetails");

const autoStatus = document.getElementById("autoStatus");
const turboMode = document.getElementById("turboMode");

/* الحالة */

let history = loadHistory();
let currentTaskController = null;
let statusTimer = null;
let busy = false;

/* أدوات عامة */

function loadHistory() {
    try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
    } catch {
        return [];
    }
}

function saveHistory() {
    try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    } catch {}
}

function getDeviceKey() {
    return localStorage.getItem(DEVICE_KEY) || "";
}

function setDeviceKey(key) {
    localStorage.setItem(DEVICE_KEY, key);
}

function sleep(ms, signal) {
    return new Promise((resolve, reject) => {
        if (signal?.aborted) {
            reject(new DOMException("Aborted", "AbortError"));
            return;
        }

        const timer = setTimeout(resolve, ms);

        signal?.addEventListener("abort", () => {
            clearTimeout(timer);
            reject(new DOMException("Aborted", "AbortError"));
        }, { once:true });
    });
}

async function api(path, options = {}) {
    const response = await fetch(API + path, {
        ...options,
        headers: {
            "Content-Type":"application/json",
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.error || data.message || "فشل الاتصال بالخادم");
    }

    return data;
}

/* عرض الرسائل */

function createMessage(role, content) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = role === "user" ? "أنت" : "NoRestrictions AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;

    wrapper.append(label, bubble);
    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

    return bubble;
}

function renderHistory() {
    chat.innerHTML = "";

    if (!history.length) {
        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.id = "welcome";
        welcome.innerHTML =
            "<h2>مرحباً بك 👋</h2><p>NoRestrictions AI<br>اكتب رسالتك للبدء.</p>";
        chat.appendChild(welcome);
        return;
    }

    for (const item of history) {
        if (!item || !["user","assistant"].includes(item.role)) continue;
        createMessage(item.role, String(item.content || ""));
    }
}

function addHistory(role, content) {
    history.push({ role, content, time:Date.now() });
    saveHistory();
}

/* حالة الجهاز */

function updateStatus(online, text) {
    statusDot.classList.toggle("online", Boolean(online));
    statusText.textContent = text || (online ? "متصل" : "غير متصل");
}

async function checkDevice() {
    const key = getDeviceKey();

    if (!key) {
        updateStatus(false, "غير مربوط");
        return;
    }

    try {
        const result = await api(
            "/api/device/status?key=" + encodeURIComponent(key)
        );

        updateStatus(Boolean(result.online), result.online ? "متصل" : "غير متصل");
    } catch {
        updateStatus(false, "تعذر الاتصال");
    }
}

function startStatusMonitoring() {
    clearInterval(statusTimer);

    statusTimer = setInterval(() => {
        if (autoStatus.checked) checkDevice();
    }, 15000);
}

/* نافذة الربط */

function openDeviceModal() {
    modal.classList.add("show");

    const key = getDeviceKey();

    if (key) {
        deviceDetails.innerHTML = `
            <p>يوجد مفتاح محفوظ على هذا المتصفح.</p>
            <p>إذا كان الجهاز مربوطاً، شغّل Agent في Termux.</p>
        `;
    } else {
        deviceDetails.innerHTML = `
            <p>لا يوجد جهاز مربوط حالياً.</p>
        `;
    }
}

function closeDeviceModal() {
    modal.classList.remove("show");
}

function generateKey() {
    const bytes = crypto.getRandomValues(new Uint8Array(32));

    return Array.from(bytes)
        .map(x => x.toString(16).padStart(2, "0"))
        .join("");
}

async function pairDevice() {
    try {
        const key = generateKey();

        const result = await api("/api/device/pair", {
            method:"POST",
            body:JSON.stringify({
                key,
                kind:"Termux",
                info:"Android Termux device"
            })
        });

        if (result.ok === false || result.error) {
            throw new Error(result.error || "فشل الربط");
        }

        setDeviceKey(key);

        deviceDetails.innerHTML = `
            <p>تم إنشاء المفتاح وربط الجهاز.</p>
            <p>شغّل Agent في Termux باستخدام المفتاح المحفوظ.</p>
            <p>لا تشارك المفتاح مع أي شخص.</p>
        `;

        await checkDevice();

    } catch (error) {
        alert("تعذر الربط: " + error.message);
    }
}

async function unpairDevice() {
    const key = getDeviceKey();

    if (!key) {
        alert("لا يوجد جهاز مربوط.");
        return;
    }

    if (!confirm("هل تريد إلغاء ربط هذا الجهاز؟")) return;

    try {
        await api("/api/device/unpair", {
            method:"POST",
            body:JSON.stringify({ key })
        });

        localStorage.removeItem(DEVICE_KEY);

        updateStatus(false, "غير مربوط");
        closeDeviceModal();

    } catch (error) {
        alert("تعذر إلغاء الربط: " + error.message);
    }
}

/* انتظار نتيجة Termux */

async function waitForTermux(jobId, bubble, controller) {
    const signal = controller.signal;
    const started = Date.now();

    const maxWait = 180000;

    bubble.textContent = "⏳ المهمة قيد التنفيذ في Termux...";

    while (Date.now() - started < maxWait) {
        await sleep(turboMode.checked ? 1500 : 3000, signal);

        const key = getDeviceKey();

        const result = await api(
            "/api/device/result?key=" +
            encodeURIComponent(key) +
            "&id=" +
            encodeURIComponent(jobId)
        );

        if (result.status === "done") {
            return result.output || "تم التنفيذ دون مخرجات.";
        }

        if (result.status === "failed") {
            throw new Error(result.output || "فشلت المهمة.");
        }

        if (result.status === "cancelled") {
            throw new Error("تم إلغاء المهمة.");
        }
    }

    throw new Error("انتهت مهلة انتظار النتيجة.");
}

/* إرسال الرسائل */

async function sendMessage() {
    const message = input.value.trim();

    if (!message || busy) return;

    busy = true;
    sendButton.disabled = true;

    const oldValue = message;
    input.value = "";
    input.style.height = "48px";

    const userBubble = createMessage("user", oldValue);
    addHistory("user", oldValue);

    const assistantBubble = createMessage("assistant", "جاري التفكير...");
    const assistantHistoryIndex = history.length;

    currentTaskController = new AbortController();

    try {
        const response = await fetch(CHAT_API, {
            method:"POST",
            headers: {
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                messages:history.map(item => ({
                    role:item.role,
                    content:item.content
                })),
                deviceKey:getDeviceKey()
            }),
            signal:currentTaskController.signal
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.error || "حدث خطأ في الخادم.");
        }

        assistantBubble.textContent = data.reply || "تم استلام الرد.";

        if (data.termux?.status === "pending" && data.termux.id) {
            try {
                const output = await waitForTermux(
                    data.termux.id,
                    assistantBubble,
                    currentTaskController
                );

                assistantBubble.textContent =
                    (data.reply ? data.reply + "\n\n" : "") +
                    "نتيجة Termux:\n" + output;

            } catch (error) {
                if (error.name === "AbortError") {
                    assistantBubble.textContent +=
                        "\n\nتم إيقاف انتظار النتيجة من الموقع.";
                } else {
                    assistantBubble.textContent +=
                        "\n\nتعذر الحصول على النتيجة: " + error.message;
                }
            }
        }

        history.push({
            role:"assistant",
            content:assistantBubble.textContent,
            time:Date.now()
        });

        saveHistory();

    } catch (error) {
        if (error.name === "AbortError") {
            assistantBubble.textContent = "تم إيقاف انتظار الرد.";
        } else {
            assistantBubble.textContent = "حدث خطأ: " + error.message;

            // إزالة رسالة المستخدم من السجل عند فشل الطلب
            history = history.filter((item, index) =>
                !(index === history.length - 1 &&
                  item.role === "user" &&
                  item.content === oldValue)
            );

            saveHistory();
        }

    } finally {
        busy = false;
        sendButton.disabled = false;
        currentTaskController = null;
        chat.scrollTop = chat.scrollHeight;
    }
}

/* إيقاف الانتظار */

function stopWaiting() {
    if (currentTaskController) {
        currentTaskController.abort();
    }
}

/* الأحداث */

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

input.addEventListener("input", () => {
    input.style.height = "48px";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

document.getElementById("deviceButton")
    .addEventListener("click", openDeviceModal);

document.getElementById("closeModal")
    .addEventListener("click", closeDeviceModal);

document.getElementById("pairButton")
    .addEventListener("click", pairDevice);

document.getElementById("unpairButton")
    .addEventListener("click", unpairDevice);

modal.addEventListener("click", event => {
    if (event.target === modal) closeDeviceModal();
});

/* التشغيل */

renderHistory();
checkDevice();
startStatusMonitoring();
</script>

</body>
</html>
