<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoRestrictions AI</title>

<style>
:root {
    --bg: #090b10;
    --panel: #11151e;
    --panel2: #171d29;
    --border: #252d3b;
    --text: #f2f5fa;
    --muted: #8993a5;
    --accent: #7c5cff;
    --green: #26d98b;
    --red: #ff596b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    height: 100dvh;
    overflow: hidden;
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    height: 100dvh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #0d1119;
    border-left: 1px solid var(--border);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    padding: 10px 5px;
}

.logo span {
    color: var(--accent);
}

.new-chat {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: white;
    border-radius: 12px;
    padding: 13px;
    text-align: center;
}

.new-chat:hover {
    border-color: var(--accent);
}

.sidebar-title {
    color: var(--muted);
    font-size: 12px;
    margin-top: 15px;
}

.chat-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
}

.chat-item {
    background: transparent;
    border: 0;
    color: var(--muted);
    text-align: right;
    padding: 12px;
    border-radius: 9px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.chat-item.active,
.chat-item:hover {
    background: var(--panel2);
    color: white;
}

.sidebar-bottom {
    margin-top: auto;
}

.device-button {
    width: 100%;
    padding: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: white;
    border-radius: 10px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.header-title {
    font-weight: bold;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
}

.dot.online {
    background: var(--green);
}

.mobile-menu {
    display: none;
    background: transparent;
    color: white;
    border: 0;
    font-size: 22px;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.welcome {
    margin: auto;
    text-align: center;
    max-width: 450px;
    color: var(--muted);
}

.welcome h1 {
    color: white;
    font-size: 32px;
}

.welcome span {
    color: var(--accent);
}

.message {
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.avatar {
    width: 35px;
    height: 35px;
    min-width: 35px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: var(--panel2);
    font-weight: bold;
}

.user .avatar {
    background: #30245c;
}

.assistant .avatar {
    background: #173c32;
}

.content {
    min-width: 0;
    flex: 1;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.content pre {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    background: #080b11;
    border: 1px solid var(--border);
    padding: 13px;
    border-radius: 10px;
    overflow-x: auto;
}

.result-box {
    background: #101b19;
    border: 1px solid #244b3d;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
}

.result-title {
    color: var(--green);
    font-size: 13px;
    margin-bottom: 8px;
}

/* INPUT */

.input-area {
    padding: 15px;
    border-top: 1px solid var(--border);
}

.input-box {
    max-width: 850px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.input-box textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    background: transparent;
    border: 0;
    outline: none;
    color: white;
    padding: 8px;
    max-height: 150px;
    min-height: 40px;
}

.send {
    width: 43px;
    height: 43px;
    border: 0;
    border-radius: 12px;
    color: white;
    background: var(--accent);
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.hint {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 9px;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 10;
}

.modal.show {
    display: flex;
}

.modal-card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
}

.modal-card h2 {
    margin-top: 0;
}

.modal-card p {
    color: var(--muted);
    line-height: 1.7;
    font-size: 13px;
}

.modal-card input {
    width: 100%;
    background: #080b11;
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    outline: none;
    direction: ltr;
    margin: 10px 0;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 0;
}

.primary {
    background: var(--accent);
    color: white;
}

.secondary {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border) !important;
}

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #202735;
    padding: 12px 20px;
    border-radius: 10px;
    display: none;
    z-index: 20;
}

@media(max-width:750px) {
    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        z-index: 5;
        transform: translateX(100%);
        transition: .2s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .mobile-menu {
        display: block;
    }

    .header {
        padding: 0 13px;
    }

    .messages {
        padding: 18px 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            NoRestrictions <span>AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ محادثة جديدة
        </button>

        <div class="sidebar-title">المحادثات</div>

        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-bottom">
            <button class="device-button" onclick="openDeviceModal()">
                ⚙ ربط جهاز Termux
            </button>
        </div>

    </aside>

    <main class="main">

        <header class="header">

            <button class="mobile-menu" onclick="toggleSidebar()">
                ☰
            </button>

            <div class="header-title">
                NoRestrictions AI
            </div>

            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">جاري الفحص...</span>
            </div>

        </header>

        <section class="messages" id="messages"></section>

        <footer class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="اكتب رسالتك هنا..."
                    rows="1"
                ></textarea>

                <button class="send" id="sendButton" onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="hint">
                NoRestrictions AI — تأكد من مراجعة نتائج أوامر جهازك.
            </div>

        </footer>

    </main>

</div>


<!-- DEVICE MODAL -->

<div class="modal" id="deviceModal">

    <div class="modal-card">

        <h2>ربط جهاز Termux</h2>

        <p>
            شغّل Agent في Termux، ثم انسخ مفتاح الجهاز الذي يظهر
            والصقه في الخانة أدناه.
        </p>

        <input
            id="deviceKey"
            type="password"
            placeholder="Device Key"
            autocomplete="off"
        >

        <div class="modal-actions">

            <button class="primary" onclick="saveDeviceKey()">
                ربط الجهاز
            </button>

            <button class="secondary" onclick="closeDeviceModal()">
                إغلاق
            </button>

        </div>

        <p id="pairStatus"></p>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

// =====================================
// CONFIG
// =====================================

const API =
"https://norestrictions-api.sdrhaldwane.workers.dev";

const HISTORY_KEY = "nr-chat-history-v43";
const DEVICE_KEY = "nr-device-key";

const MAX_MESSAGES = 20;
const RESULT_TIMEOUT = 120000;


// =====================================
// STATE
// =====================================

let conversations = [];
let currentChatId = null;
let sending = false;
let statusTimer = null;


// =====================================
// HELPERS
// =====================================

function $(id) {
    return document.getElementById(id);
}

function toast(message) {
    const el = $("toast");

    el.textContent = message;
    el.style.display = "block";

    setTimeout(() => {
        el.style.display = "none";
    }, 2500);
}

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

function getCurrentChat() {
    return conversations.find(
        chat => chat.id === currentChatId
    );
}

function saveHistory() {
    try {
        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(conversations)
        );
    } catch {
        toast("تعذر حفظ المحادثات.");
    }
}


// =====================================
// CONVERSATIONS
// =====================================

function createChat() {
    const chat = {
        id: crypto.randomUUID(),
        title: "محادثة جديدة",
        messages: [],
        createdAt: Date.now()
    };

    conversations.unshift(chat);

    currentChatId = chat.id;

    saveHistory();
    renderChatList();
    renderMessages();
}

function newChat() {
    createChat();

    $("messageInput").value = "";

    if (window.innerWidth <= 750) {
        $("sidebar").classList.remove("open");
    }
}

function loadHistory() {
    try {
        conversations = JSON.parse(
            localStorage.getItem(HISTORY_KEY) || "[]"
        );

        if (!Array.isArray(conversations)) {
            conversations = [];
        }

    } catch {
        conversations = [];
    }

    if (conversations.length) {
        currentChatId = conversations[0].id;
    } else {
        createChat();
    }

    renderChatList();
    renderMessages();
}

function selectChat(id) {
    currentChatId = id;

    renderChatList();
    renderMessages();

    $("sidebar").classList.remove("open");
}

function renderChatList() {
    const list = $("chatList");

    list.innerHTML = "";

    conversations.forEach(chat => {
        const button = document.createElement("button");

        button.className =
            "chat-item " +
            (chat.id === currentChatId ? "active" : "");

        button.textContent = chat.title || "محادثة جديدة";

        button.onclick = () => selectChat(chat.id);

        list.appendChild(button);
    });
}


// =====================================
// MESSAGE RENDERING
// =====================================

function renderMessages() {
    const box = $("messages");
    const chat = getCurrentChat();

    box.innerHTML = "";

    if (!chat || !chat.messages.length) {
        box.innerHTML = `
            <div class="welcome">
                <h1>NoRestrictions <span>AI</span></h1>
                <p>مرحباً بك، كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        `;

        return;
    }

    chat.messages.forEach(message => {
        addMessageElement(message, false);
    });

    box.scrollTop = box.scrollHeight;
}

function addMessageElement(message, scroll = true) {
    const box = $("messages");

    const row = document.createElement("div");

    row.className =
        "message " +
        (message.role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    avatar.textContent =
        message.role === "user" ? "أنت" : "AI";

    const content = document.createElement("div");
    content.className = "content";

    content.textContent = message.content || "";

    if (message.result !== undefined) {
        const result = document.createElement("div");

        result.className = "result-box";

        const title = document.createElement("div");
        title.className = "result-title";
        title.textContent = "نتيجة Termux";

        const output = document.createElement("pre");
        output.textContent = message.result;

        result.appendChild(title);
        result.appendChild(output);

        content.appendChild(result);
    }

    row.appendChild(avatar);
    row.appendChild(content);

    box.appendChild(row);

    if (scroll) {
        box.scrollTop = box.scrollHeight;
    }

    return content;
}


// =====================================
// DEVICE KEY
// =====================================

function openDeviceModal() {
    $("deviceModal").classList.add("show");

    $("deviceKey").value =
        localStorage.getItem(DEVICE_KEY) || "";

    $("pairStatus").textContent = "";
}

function closeDeviceModal() {
    $("deviceModal").classList.remove("show");
}

async function saveDeviceKey() {
    const key = $("deviceKey").value.trim();

    if (!/^[a-f0-9]{64}$/i.test(key)) {
        $("pairStatus").textContent =
            "المفتاح يجب أن يتكون من 64 خانة hex.";

        return;
    }

    $("pairStatus").textContent = "جاري الربط...";

    try {
        const response = await fetch(
            API + "/api/device/pair",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    key,
                    kind: "Termux",
                    info: "NoRestrictions AI"
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(data.error || "فشل الربط");
        }

        localStorage.setItem(DEVICE_KEY, key);

        $("pairStatus").textContent =
            "تم تسجيل الجهاز. جاري فحص الاتصال...";

        await checkDeviceStatus();

        toast("تم حفظ مفتاح الجهاز.");

        setTimeout(closeDeviceModal, 1000);

    } catch (error) {
        $("pairStatus").textContent = error.message;
    }
}


// =====================================
// DEVICE STATUS
// =====================================

async function checkDeviceStatus() {
    const key = localStorage.getItem(DEVICE_KEY);

    const dot = $("statusDot");
    const label = $("statusText");

    if (!key) {
        dot.classList.remove("online");
        label.textContent = "غير مربوط";
        return false;
    }

    try {
        const response = await fetch(
            API + "/api/device/status?key=" +
            encodeURIComponent(key)
        );

        const data = await response.json();

        const online =
            response.ok &&
            data.ok &&
            data.paired &&
            data.online;

        dot.classList.toggle("online", online);

        label.textContent =
            online ? "Termux متصل" : "Termux غير متصل";

        return online;

    } catch {
        dot.classList.remove("online");
        label.textContent = "تعذر الاتصال بالسيرفر";

        return false;
    }
}


// =====================================
// API CHAT
// =====================================

async function callChat(messages) {
    const key = localStorage.getItem(DEVICE_KEY);

    const response = await fetch(
        API + "/api/chat",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: messages.slice(-MAX_MESSAGES),
                deviceKey: key || null
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error || "Chat request failed"
        );
    }

    return data;
}


// =====================================
// TERMUX RESULT
// =====================================

async function waitForResult(jobId, assistantMessage, contentElement) {
    const key = localStorage.getItem(DEVICE_KEY);

    if (!key) {
        assistantMessage.content +=
            "\nلم يتم العثور على مفتاح الجهاز.";

        return;
    }

    const start = Date.now();

    assistantMessage.content +=
        "\n\n⏳ أنتظر تنفيذ المهمة في Termux...";

    contentElement.textContent = assistantMessage.content;

    while (Date.now() - start < RESULT_TIMEOUT) {
        await new Promise(resolve => setTimeout(resolve, 2000));

        try {
            const url =
                API +
                "/api/device/result?key=" +
                encodeURIComponent(key) +
                "&id=" +
                encodeURIComponent(jobId);

            const response = await fetch(url);

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Result error");
            }

            if (data.status === "done" || data.status === "failed") {
                assistantMessage.content =
                    assistantMessage.content.replace(
                        "\n\n⏳ أنتظر تنفيذ المهمة في Termux...",
                        ""
                    );

                assistantMessage.result =
                    data.output || "(لا توجد نتيجة)";

                assistantMessage.content +=
                    data.status === "done"
                    ? "\n\nتم تنفيذ المهمة."
                    : "\n\nفشل تنفيذ المهمة.";

                assistantMessage.exitCode = data.exit_code;

                contentElement.textContent =
                    assistantMessage.content;

                const result = document.createElement("div");
                result.className = "result-box";

                const title = document.createElement("div");
                title.className = "result-title";
                title.textContent = "نتيجة Termux";

                const output = document.createElement("pre");
                output.textContent = assistantMessage.result;

                result.appendChild(title);
                result.appendChild(output);

                contentElement.appendChild(result);

                saveHistory();

                return;
            }

            if (data.status === "cancelled") {
                assistantMessage.content +=
                    "\n\nتم إلغاء المهمة.";

                contentElement.textContent =
                    assistantMessage.content;

                saveHistory();

                return;
            }

        } catch (error) {
            console.error("Result polling:", error);
        }
    }

    assistantMessage.content +=
        "\n\nانتهت مهلة الانتظار. تحقق من اتصال Agent في Termux.";

    contentElement.textContent =
        assistantMessage.content;

    saveHistory();
}


// =====================================
// SEND MESSAGE
// =====================================

async function sendMessage() {
    if (sending) return;

    const input = $("messageInput");

    const text = input.value.trim();

    if (!text) return;

    const chat = getCurrentChat();

    if (!chat) return;

    sending = true;

    $("sendButton").disabled = true;

    const welcome = $("messages").querySelector(".welcome");

    if (welcome) welcome.remove();

    const userMessage = {
        role: "user",
        content: text
    };

    chat.messages.push(userMessage);

    if (
        chat.title === "محادثة جديدة" &&
        chat.messages.length === 1
    ) {
        chat.title = text.slice(0, 35);
    }

    addMessageElement(userMessage);

    input.value = "";
    input.style.height = "40px";

    const assistantMessage = {
        role: "assistant",
        content: "جاري التفكير..."
    };

    chat.messages.push(assistantMessage);

    const contentElement =
        addMessageElement(assistantMessage);

    saveHistory();
    renderChatList();

    try {
        const history = chat.messages
            .filter(message =>
                message.role === "user" ||
                message.role === "assistant"
            )
            .slice(-MAX_MESSAGES)
            .map(message => ({
                role: message.role,
                content: message.content
            }));

        // Remove the temporary waiting message from the API history.
        history.pop();

        const data = await callChat(history);

        assistantMessage.content =
            data.reply || "لم يصل رد.";

        contentElement.textContent =
            assistantMessage.content;

        saveHistory();

        if (
            data.termux &&
            data.termux.status === "pending" &&
            data.termux.id
        ) {
            await waitForResult(
                data.termux.id,
                assistantMessage,
                contentElement
            );
        }

    } catch (error) {
        assistantMessage.content =
            "حدث خطأ: " + error.message;

        contentElement.textContent =
            assistantMessage.content;

        saveHistory();

    } finally {
        sending = false;
        $("sendButton").disabled = false;
        input.focus();
    }
}


// =====================================
// INPUT EVENTS
// =====================================

$("messageInput").addEventListener("keydown", event => {
    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {
        event.preventDefault();
        sendMessage();
    }
});

$("messageInput").addEventListener("input", event => {
    event.target.style.height = "40px";

    event.target.style.height =
        Math.min(event.target.scrollHeight, 150) + "px";
});


// =====================================
// MOBILE SIDEBAR
// =====================================

function toggleSidebar() {
    $("sidebar").classList.toggle("open");
}


// =====================================
// START
// =====================================

loadHistory();

checkDeviceStatus();

statusTimer = setInterval(
    checkDeviceStatus,
    5000
);

</script>

</body>
    </html>
