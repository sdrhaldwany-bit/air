<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoRestrictions AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0d0d0d;color:#eee;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 padding:16px;background:#171717;border-bottom:1px solid #292929;
 display:flex;justify-content:space-between;align-items:center
}
h2{margin:0;color:#fff;font-size:19px}
#status{font-size:12px;color:#aaa}
#termux{
 margin:12px;padding:10px;border:1px solid #333;
 border-radius:10px;background:#171717;color:#ddd
}
#chat{
 flex:1;overflow-y:auto;padding:16px;
 display:flex;flex-direction:column;gap:12px
}
.msg{
 padding:12px 15px;border-radius:13px;max-width:85%;
 line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere
}
.user{background:#244d3b;align-self:flex-start}
.ai{background:#202020;align-self:flex-end}
#form{
 display:flex;gap:8px;padding:12px;background:#171717;
 border-top:1px solid #292929
}
textarea{
 flex:1;resize:none;min-height:45px;max-height:120px;
 padding:12px;border-radius:10px;border:1px solid #333;
 background:#0d0d0d;color:white;font-size:15px;outline:none
}
button{
 border:0;border-radius:10px;padding:0 17px;
 background:#21a36b;color:white;font-size:15px;cursor:pointer
}
button:disabled{opacity:.5}
#termux button{padding:8px 12px}
</style>
</head>
<body><header>
 <h2>NoRestrictions AI</h2>
 <span id="status">جاهز</span>
</header><div id="termux">
 <div>اتصال Termux: <span id="termuxStatus">غير متصل</span></div>
 <button onclick="checkTermux()">فحص الاتصال</button>
 <small>يتطلب إعداد خادم محلي آمن داخل Termux.</small>
</div><main id="chat">
 <div class="msg ai">مرحباً! أنا NoRestrictions AI. كيف أستطيع مساعدتك؟</div>
</main><form id="form">
 <textarea id="input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
 <button id="send" type="submit">إرسال</button>
</form><script>
const API_URL = "/api/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusText = document.getElementById("status");

let messages = [];

function addMessage(text, type) {
 const div = document.createElement("div");
 div.className = "msg " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
 return div;
}

async function sendMessage(text) {
 if (!text.trim()) return;

 addMessage(text, "user");
 messages.push({role:"user", content:text});

 input.value = "";
 sendBtn.disabled = true;
 statusText.textContent = "يفكر...";

 const loading = addMessage("جاري التفكير...", "ai");

 try {
  const response = await fetch(API_URL, {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });

  const data = await response.json();

  if (!response.ok) {
   throw new Error(data.error || "حدث خطأ في الخادم");
  }

  if (!data.reply) {
   throw new Error("لم يصل رد من الخادم");
  }

  loading.textContent = data.reply;
  messages.push({role:"assistant", content:data.reply});
  statusText.textContent = "متصل";
 } catch(error) {
  loading.textContent = "خطأ: " + error.message;
  statusText.textContent = "تعذر الاتصال";
 } finally {
  sendBtn.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
 }
}

document.getElementById("form").addEventListener("submit", function(e){
 e.preventDefault();
 sendMessage(input.value);
});

input.addEventListener("keydown", function(e){
 if(e.key === "Enter" && !e.shiftKey){
  e.preventDefault();
  document.getElementById("form").requestSubmit();
 }
});

async function checkTermux() {
 const result = document.getElementById("termuxStatus");
 result.textContent = "جارٍ الفحص...";

 try {
  const response = await fetch("http://127.0.0.1:8765/status", {
   method:"GET",
   signal:AbortSignal.timeout(3000)
  });

  if (!response.ok) throw new Error();

  const data = await response.json();
  result.textContent = data.connected ? "متصل" : "غير متصل";
 } catch {
  result.textContent = "غير متصل";
 }
}
</script></body>
</html>
