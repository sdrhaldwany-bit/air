<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NoRestrictions AI — دردشة</title>
<meta name="theme-color" content="#0b0d10">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0b0d10;
  --panel:#12151a;
  --line:#1f242c;
  --text:#e8eaed;
  --muted:#8a919c;
  --accent:#3ee6a8;
  --accent-ink:#04140d;
  --user:#1c3b30;
  --ai:#161a20;
  --err:#ff7a7a;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body {
  height:100%;
}

body {
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  height:100dvh;
  overflow:hidden;
}

.app {
  width:100%;
  max-width:860px;
  display:flex;
  flex-direction:column;
  height:100%;
  border-inline:1px solid var(--line);
  background:var(--panel);
}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:1.05rem;
}

.dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}

.model {
  font-size:.75rem;
  color:var(--muted);
  font-weight:500;
  border:1px solid var(--line);
  padding:2px 8px;
  border-radius:999px;
}

.ghost {
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  padding:7px 12px;
  border-radius:8px;
  cursor:pointer;
  font:inherit;
  font-size:.85rem;
}

.ghost:hover {
  color:var(--accent);
  border-color:var(--accent);
}

main {
  flex:1;
  overflow-y:auto;
  padding:22px 18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.empty {
  margin:auto;
  text-align:center;
  color:var(--muted);
  max-width:420px;
}

.empty h2 {
  color:var(--text);
  font-size:1.4rem;
  margin-bottom:8px;
}

.chips {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:18px;
}

.chip {
  border:1px solid var(--line);
  background:var(--ai);
  color:var(--text);
  padding:8px 12px;
  border-radius:999px;
  cursor:pointer;
  font:inherit;
  font-size:.85rem;
}

.chip:hover {
  border-color:var(--accent);
}

.msg {
  max-width:82%;
  padding:11px 15px;
  border-radius:14px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:.97rem;
}

.msg.user {
  align-self:flex-start;
  background:var(--user);
  border-start-start-radius:4px;
}

.msg.ai {
  align-self:flex-end;
  background:var(--ai);
  border:1px solid var(--line);
  border-start-end-radius:4px;
}

.msg.err {
  align-self:center;
  color:var(--err);
  background:none;
  font-size:.88rem;
  text-align:center;
}

.msg.ai:has(.codebox) {
  max-width:94%;
}

.codebox {
  direction:ltr;
  text-align:left;
  margin:10px 0;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:#0a0c0f;
  white-space:normal;
}

.codebar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 10px;
  background:#1a1f26;
  border-bottom:1px solid var(--line);
  font-size:.75rem;
  color:var(--muted);
  font-family:monospace;
}

.copy {
  background:none;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:6px;
  padding:3px 10px;
  cursor:pointer;
  font:inherit;
  font-size:.75rem;
}

.copy.ok {
  color:var(--accent);
  border-color:var(--accent);
}

.codebox pre {
  margin:0;
  padding:12px 14px;
  overflow-x:auto;
  white-space:pre;
  font-family:monospace;
  font-size:.86rem;
  line-height:1.6;
  color:#d7e1ea;
}

.msg code.inline {
  direction:ltr;
  unicode-bidi:isolate;
  background:#0a0c0f;
  border:1px solid var(--line);
  border-radius:5px;
  padding:1px 6px;
  font-family:monospace;
}

.msg a {
  color:var(--accent);
  text-decoration:underline;
  word-break:break-all;
}

.msg .h {
  display:block;
  font-weight:700;
  font-size:1.05em;
  margin-top:4px;
}

.sources {
  margin-top:10px;
  padding-top:8px;
  border-top:1px dashed var(--line);
  font-size:.82rem;
  color:var(--muted);
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
}

.sources a {
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 10px;
  text-decoration:none;
  color:var(--text);
  max-width:240px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.typing span {
  display:inline-block;
  width:7px;
  height:7px;
  margin:0 2px;
  border-radius:50%;
  background:var(--muted);
  animation:b 1.2s infinite;
}

.typing span:nth-child(2) {
  animation-delay:.15s;
}

.typing span:nth-child(3) {
  animation-delay:.3s;
}

@keyframes b {
  0%,80%,100% {
    opacity:.25;
    transform:translateY(0);
  }
  40% {
    opacity:1;
    transform:translateY(-3px);
  }
}

.status {
  font-size:.8rem;
  color:var(--muted);
  margin-inline-start:6px;
}

form {
  display:flex;
  gap:10px;
  align-items:flex-end;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}

textarea {
  flex:1;
  resize:none;
  max-height:180px;
  min-height:48px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  font:inherit;
  font-size:1rem;
  outline:none;
}

textarea:focus {
  border-color:var(--accent);
}

.send {
  height:48px;
  padding:0 20px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:var(--accent-ink);
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

.send:disabled {
  opacity:.4;
  cursor:not-allowed;
}

.stopbtn {
  background:var(--err);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:0 14px;
  height:48px;
  cursor:pointer;
  font:inherit;
  font-weight:700;
}

@media(max-width:600px) {
  .msg {
    max-width:94%;
  }
  .model {
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <span class="dot"></span>
    NoRestrictions AI
    <span class="model">notrack-uncensored</span>
  </div>

  <button class="ghost" id="newChat" type="button">
    محادثة جديدة
  </button>
</header>

<main id="chat"></main>

<form id="form">
  <textarea id="input" rows="1"
    placeholder="اكتب رسالتك… (Enter للإرسال، Shift+Enter لسطر جديد)"
    autofocus></textarea>

  <button class="stopbtn" id="stopBtn" type="button" hidden>
    ⏹ إيقاف
  </button>

  <button class="send" id="send" type="submit">
    إرسال
  </button>
</form>

</div>

<script>
/* إعداد الاتصال بـ Cloudflare Worker */
const API_URL =
"https://norestrictions-api.sdrhaldwane.workers.dev/api/chat";

/* عناصر الصفحة */
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stopBtn");

/* سجل المحادثة */
const KEY = "nr-chat-history";

let history = [];

try {
  history = JSON.parse(localStorage.getItem(KEY)) || [];
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

let busy = false;
let chatAbort = null;

function save() {
  localStorage.setItem(
    KEY,
    JSON.stringify(history.slice(-40))
  );
}

/* الروابط الآمنة */
function safeUrl(url) {
  try {
    const u = new URL(url);
    return ["http:", "https:"].includes(u.protocol)
      ? u.href
      : null;
  } catch {
    return null;
  }
}

function hostOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, "");
  } catch {
    return url;
  }
}

function makeLink(url, label) {
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = label;
  return a;
}

/* تنسيق النص */
const INLINE_RE =
/(`[^`\n]+`|\[[^\]\n]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s<>"'`)\]]+|\*\*[^*\n]+\*\*)/;

function addSpans(parent, text) {
  text.split(INLINE_RE).forEach(part => {
    if (!part) return;

    let m;

    if (/^`[^`\n]+`$/.test(part)) {
      const c = document.createElement("code");
      c.className = "inline";
      c.textContent = part.slice(1, -1);
      parent.appendChild(c);
    }

    else if (
      (m = part.match(/^\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)$/))
      && safeUrl(m[2])
    ) {
      parent.appendChild(makeLink(safeUrl(m[2]), m[1]));
    }

    else if (/^https?:\/\//.test(part)) {
      const clean = part.replace(/[.,،؛!?]+$/, "");
      const url = safeUrl(clean);

      if (url) {
        parent.appendChild(makeLink(url, clean));
        if (clean !== part) {
          parent.appendChild(
            document.createTextNode(part.slice(clean.length))
          );
        }
      } else {
        parent.appendChild(document.createTextNode(part));
      }
    }

    else if (/^\*\*[^*\n]+\*\*$/.test(part)) {
      const b = document.createElement("strong");
      b.textContent = part.slice(2, -2);
      parent.appendChild(b);
    }

    else {
      parent.appendChild(document.createTextNode(part));
    }
  });
}

function addInline(parent, text) {
  text.split("\n").forEach((line, i, arr) => {
    const h = line.match(/^#{1,6}\s+(.*)$/);

    if (h) {
      const s = document.createElement("span");
      s.className = "h";
      addSpans(s, h[1]);
      parent.appendChild(s);
    } else {
      addSpans(parent, line.replace(/^(\s*)[-*]\s+/, "$1• "));
    }

    if (i < arr.length - 1) {
      parent.appendChild(document.createTextNode("\n"));
    }
  });
}

/* نسخ الأكواد */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }

  const t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed";
  t.style.opacity = "0";

  document.body.appendChild(t);
  t.select();
  document.execCommand("copy");
  t.remove();
}

/* إنشاء مربع كود */
function codeBox(lang, code) {
  const box = document.createElement("div");
  box.className = "codebox";

  const bar = document.createElement("div");
  bar.className = "codebar";

  const label = document.createElement("span");
  label.textContent = lang || "code";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "copy";
  btn.textContent = "نسخ";

  btn.onclick = () => {
    copyText(code).then(() => {
      btn.textContent = "تم النسخ ✓";
      btn.classList.add("ok");

      setTimeout(() => {
        btn.textContent = "نسخ";
        btn.classList.remove("ok");
      }, 1800);
    });
  };

  const acts = document.createElement("div");
  acts.appendChild(btn);

  const pre = document.createElement("pre");
  const c = document.createElement("code");
  c.textContent = code;

  pre.appendChild(c);
  bar.append(label, acts);
  box.append(bar, pre);

  return box;
}

/* عرض الردود والأكواد */
function renderRich(el, text) {
  const re = /```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(?:```|$)/g;

  let last = 0;
  let m;

  while ((m = re.exec(text))) {
    if (m.index > last) {
      addInline(
        el,
        text.slice(last, m.index).replace(/\n+$/, "")
      );
    }

    el.appendChild(
      codeBox(m[1], m[2].replace(/\n$/, ""))
    );

    last = re.lastIndex;

    if (m[0] === "") re.lastIndex++;
  }

  if (last < text.length) {
    addInline(
      el,
      text.slice(last).replace(/^\n+/, "")
    );
  }
}

/* إنشاء رسالة */
function bubble(role, text, sources) {
  const el = document.createElement("div");
  el.className = "msg " + role;

  if (role === "ai") {
    renderRich(el, text);
  } else {
    el.textContent = text;
  }

  if (role === "ai" && Array.isArray(sources) && sources.length) {
    const box = document.createElement("div");
    box.className = "sources";

    box.appendChild(
      document.createTextNode("المصادر:")
    );

    sources.forEach(src => {
      const url = safeUrl(src.url);
      if (!url) return;

      box.appendChild(
        makeLink(url, src.title || hostOf(url))
      );
    });

    el.appendChild(box);
  }

  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;

  return el;
}

/* الصفحة الرئيسية */
function renderEmpty() {
  chat.innerHTML = `
    <div class="empty">
      <h2>أهلاً 👋</h2>

      <p>
        أنا NoRestrictions AI.
        اسألني عن أي شيء، أو اطلب المساعدة في البرمجة
        والشرح والكتابة.
      </p>

      <div class="chips">
        <button class="chip" type="button">
          اشرح لي الذكاء الاصطناعي
        </button>

        <button class="chip" type="button">
          ساعدني في كتابة كود
        </button>

        <button class="chip" type="button">
          اشرح لي Cloudflare
        </button>

        <button class="chip" type="button">
          علمني Python
        </button>
      </div>
    </div>
  `;

  chat.querySelectorAll(".chip").forEach(btn => {
    btn.onclick = () => {
      input.value = btn.textContent.trim();
      form.requestSubmit();
    };
  });
}

/* تحميل المحادثات السابقة */
function render() {
  chat.innerHTML = "";

  if (!history.length) {
    renderEmpty();
    return;
  }

  history.forEach(m => {
    bubble(
      m.role === "user" ? "user" : "ai",
      m.content,
      m.sources
    );
  });
}

/* الاتصال بـ Cloudflare Worker */
async function streamChat(payload, onEvent) {
  chatAbort = new AbortController();

  const res = await fetch(API_URL, {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify(payload),

    signal: chatAbort.signal
  });

  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    throw new Error(
      data.error || ("خطأ HTTP " + res.status)
    );
  }

  if (!data.reply) {
    throw new Error("لم يصل رد من الخادم.");
  }

  onEvent({
    t: "done",
    reply: data.reply,
    sources: data.sources || []
  });
}

/* إرسال الرسائل */
async function send(text) {
  if (busy || !text.trim()) return;

  busy = true;

  sendBtn.disabled = true;
  stopBtn.hidden = false;

  if (!history.length) {
    chat.innerHTML = "";
  }

  history.push({
    role: "user",
    content: text
  });

  save();

  bubble("user", text);

  const typing = bubble("ai", "");
  typing.classList.add("typing");

  typing.innerHTML =
    "<span></span><span></span><span></span>";

  try {
    const payload = {
      messages: history.map(m => ({
        role: m.role,
        content: m.content
      }))
    };

    let final = null;

    await streamChat(payload, ev => {
      if (ev.t === "done") {
        final = ev;
      }
    });

    if (!final || !final.reply) {
      throw new Error("لم يصل رد من الذكاء الاصطناعي.");
    }

    typing.remove();

    const sources = Array.isArray(final.sources)
      ? final.sources
      : [];

    history.push({
      role: "assistant",
      content: final.reply,
      sources
    });

    save();

    bubble("ai", final.reply, sources);

  } catch (e) {
    typing.remove();

    history.pop();
    save();

    if (e.name === "AbortError") {
      bubble("err", "⏹ تم إيقاف الطلب.");
    } else {
      bubble("err", "⚠️ " + e.message);
      input.value = text;
    }

  } finally {
    chatAbort = null;
    busy = false;

    sendBtn.disabled = false;
    stopBtn.hidden = true;

    input.focus();
  }
}

/* إرسال النموذج */
form.addEventListener("submit", e => {
  e.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";
  input.style.height = "";

  send(text);
});

/* Enter للإرسال */
input.addEventListener("keydown", e => {
  if (
    e.key === "Enter" &&
    !e.shiftKey &&
    !e.isComposing
  ) {
    e.preventDefault();
    form.requestSubmit();
  }
});

/* ضبط ارتفاع مربع الكتابة */
input.addEventListener("input", () => {
  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight, 180) + "px";
});

/* محادثة جديدة */
document.getElementById("newChat").onclick = () => {
  history = [];
  save();
  render();
  input.focus();
};

/* إيقاف الطلب */
stopBtn.onclick = () => {
  if (chatAbort) {
    chatAbort.abort();
  }
};

/* تشغيل الصفحة */
render();

</script>

</body>
</html>
