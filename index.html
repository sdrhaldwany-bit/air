<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>NoRestrictions AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0b0d10;
  --panel:#12151a;
  --line:#252b33;
  --text:#e8eaed;
  --muted:#8a919c;
  --accent:#3ee6a8;
  --user:#1c3b30;
  --ai:#171c23;
  --error:#ff7777;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body {
  width:100%;
  height:100%;
}

body {
  font-family:"IBM Plex Sans Arabic",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

.app {
  width:100%;
  max-width:900px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-inline:1px solid var(--line);
}

header {
  min-height:65px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid var(--line);
}

.brand {
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700;
  white-space:nowrap;
}

.dot {
  width:9px;
  height:9px;
  background:var(--accent);
  border-radius:50%;
  box-shadow:0 0 10px var(--accent);
}

.actions {
  display:flex;
  align-items:center;
  gap:7px;
}

button {
  font-family:inherit;
  cursor:pointer;
}

.ghost {
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:8px;
  padding:7px 11px;
  font-size:13px;
}

.ghost:hover {
  border-color:var(--accent);
  color:var(--accent);
}

main {
  flex:1;
  overflow-y:auto;
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  scroll-behavior:smooth;
}

.empty {
  margin:auto;
  text-align:center;
  color:var(--muted);
  max-width:450px;
  line-height:1.8;
}

.empty h2 {
  color:var(--text);
  margin-bottom:8px;
}

.chips {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:18px;
}

.chip {
  background:var(--ai);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:20px;
  padding:8px 12px;
  font-size:13px;
}

.chip:hover {
  border-color:var(--accent);
}

.msg {
  max-width:85%;
  padding:11px 15px;
  border-radius:14px;
  line-height:1.8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.msg.user {
  align-self:flex-start;
  background:var(--user);
  border-start-start-radius:4px;
}

.msg.ai {
  align-self:flex-end;
  background:var(--ai);
  border:1px solid var(--line);
  border-start-end-radius:4px;
}

.msg.error {
  align-self:center;
  color:var(--error);
  background:transparent;
  text-align:center;
  font-size:13px;
}

.msg a {
  color:var(--accent);
  overflow-wrap:anywhere;
}

.codebox {
  direction:ltr;
  text-align:left;
  margin:10px 0;
  background:#080b0e;
  border:1px solid var(--line);
  border-radius:9px;
  overflow:hidden;
}

.codebar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px;
  background:#1b2027;
  color:var(--muted);
  font-size:12px;
}

.copy {
  background:transparent;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:5px;
  padding:3px 9px;
}

pre {
  padding:13px;
  overflow-x:auto;
  white-space:pre;
  font-size:13px;
  line-height:1.6;
}

.typing {
  color:var(--muted);
  font-size:13px;
}

.typing span {
  display:inline-block;
  width:6px;
  height:6px;
  background:var(--muted);
  border-radius:50%;
  margin:0 3px;
  animation:blink 1s infinite;
}

.typing span:nth-child(2) {
  animation-delay:.2s;
}

.typing span:nth-child(3) {
  animation-delay:.4s;
}

@keyframes blink {
  0%,100% {opacity:.2}
  50% {opacity:1}
}

footer {
  border-top:1px solid var(--line);
  padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}

form {
  display:flex;
  align-items:flex-end;
  gap:9px;
}

textarea {
  flex:1;
  min-width:0;
  min-height:48px;
  max-height:150px;
  resize:none;
  outline:none;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  padding:12px;
  font:inherit;
}

textarea:focus {
  border-color:var(--accent);
}

.send {
  height:48px;
  padding:0 19px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:#06150e;
  font-weight:700;
}

.send:disabled {
  opacity:.4;
  cursor:not-allowed;
}

.stop {
  height:48px;
  padding:0 13px;
  border:0;
  border-radius:10px;
  background:#d94d4d;
  color:white;
}

.hidden {
  display:none !important;
}

.modal {
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:10;
}

.modal.show {
  display:flex;
}

.sheet {
  width:100%;
  max-width:430px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  line-height:1.8;
}

.sheet h3 {
  margin-bottom:10px;
}

.sheet p {
  color:var(--muted);
  font-size:14px;
}

.status {
  margin-top:13px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:13px;
}

@media(max-width:600px) {
  header {
    padding:10px;
  }

  .brand {
    font-size:13px;
  }

  .ghost {
    padding:6px 8px;
    font-size:11px;
  }

  .msg {
    max-width:95%;
  }

  main {
    padding:14px 10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <span class="dot"></span>
    NoRestrictions AI
  </div>

  <div class="actions">
    <button class="ghost" id="connectionBtn">اتصال</button>
    <button class="ghost" id="newChat">محادثة جديدة</button>
  </div>
</header>

<main id="chat">
</main>

<footer>
  <form id="form">
    <textarea
      id="input"
      rows="1"
      placeholder="اكتب رسالتك هنا..."
      autocomplete="off"
    ></textarea>

    <button class="stop hidden" id="stopBtn" type="button">
      إيقاف
    </button>

    <button class="send" id="sendBtn" type="submit">
      إرسال
    </button>
  </form>
</footer>

</div>

<div class="modal" id="connectionModal">
  <div class="sheet">
    <h3>حالة الاتصال</h3>
    <p>
      فحص الاتصال بخادم NoRestrictions AI.
    </p>
    <div class="status" id="connectionStatus">
      لم يتم الفحص بعد.
    </div>
    <br>
    <button class="ghost" id="checkConnection">فحص الاتصال</button>
    <button class="ghost" id="closeModal">إغلاق</button>
  </div>
</div>

<script>
"use strict";

/* إعدادات الخادم */

const API_URL =
"https://norestrictions-api.sdrhaldwane.workers.dev/api/chat";

const HISTORY_KEY = "nr-chat-history";

/* عناصر الصفحة */

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const stopBtn = document.getElementById("stopBtn");

/* حالة التطبيق */

let history = [];
let busy = false;
let activeController = null;
let activeRequestId = 0;

/* تحميل المحادثات */

try {
  const saved = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  if (Array.isArray(saved)) {
    history = saved;
  }
} catch {
  history = [];
}

/* حفظ المحادثات */

function saveHistory() {
  try {
    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history.slice(-40))
    );
  } catch (error) {
    console.error("History save error:", error);
  }
}

/* تنظيف النصوص وعرضها بأمان */

function createMessage(role, content) {
  const element = document.createElement("div");

  element.className =
    role === "user" ? "msg user" : "msg ai";

  renderContent(element, content);

  chat.appendChild(element);
  scrollBottom();

  return element;
}

/* تحويل النص والروابط وأكواد البرمجة */

function renderContent(element, content) {
  element.replaceChildren();

  const text = String(content || "");

  const regex = /```([\w+#.-]*)\s*\n([\s\S]*?)```/g;

  let lastIndex = 0;
  let match;

  while ((match = regex.exec(text)) !== null) {

    if (match.index > lastIndex) {
      addTextWithLinks(
        element,
        text.slice(lastIndex, match.index)
      );
    }

    const box = document.createElement("div");
    box.className = "codebox";

    const bar = document.createElement("div");
    bar.className = "codebar";

    const label = document.createElement("span");
    label.textContent = match[1] || "Code";

    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "نسخ";

    const code = match[2];

    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(code);
        copy.textContent = "تم النسخ";

        setTimeout(() => {
          copy.textContent = "نسخ";
        }, 1500);
      } catch {
        copy.textContent = "تعذر النسخ";
      }
    };

    bar.append(label, copy);

    const pre = document.createElement("pre");
    pre.textContent = code;

    box.append(bar, pre);
    element.appendChild(box);

    lastIndex = regex.lastIndex;
  }

  if (lastIndex < text.length) {
    addTextWithLinks(
      element,
      text.slice(lastIndex)
    );
  }
}

/* إظهار الروابط كرابط قابل للضغط */

function addTextWithLinks(element, text) {
  const regex = /(https?:\/\/[^\s<]+)/g;

  let lastIndex = 0;
  let match;

  while ((match = regex.exec(text)) !== null) {

    if (match.index > lastIndex) {
      element.appendChild(
        document.createTextNode(
          text.slice(lastIndex, match.index)
        )
      );
    }

    let url = match[0].replace(/[),.،]+$/, "");

    try {
      const parsed = new URL(url);

      if (
        parsed.protocol === "https:" ||
        parsed.protocol === "http:"
      ) {
        const link = document.createElement("a");

        link.href = parsed.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = url;

        element.appendChild(link);
      } else {
        element.appendChild(
          document.createTextNode(url)
        );
      }
    } catch {
      element.appendChild(
        document.createTextNode(url)
      );
    }

    lastIndex = regex.lastIndex;
  }

  if (lastIndex < text.length) {
    element.appendChild(
      document.createTextNode(
        text.slice(lastIndex)
      )
    );
  }
}

/* التمرير إلى آخر رسالة */

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

/* الشاشة الرئيسية */

function renderEmpty() {
  chat.innerHTML = `
    <div class="empty">
      <h2>أهلاً بك في NoRestrictions AI</h2>

      <p>
        اكتب سؤالك وسيجيبك الذكاء الاصطناعي.
      </p>

      <div class="chips">
        <button class="chip">اشرح لي الذكاء الاصطناعي</button>
        <button class="chip">ساعدني في البرمجة</button>
        <button class="chip">ما آخر أخبار التقنية؟</button>
      </div>
    </div>
  `;

  chat.querySelectorAll(".chip").forEach(button => {
    button.addEventListener("click", () => {
      input.value = button.textContent;
      form.requestSubmit();
    });
  });
}

/* إعادة عرض المحادثة */

function renderHistory() {
  chat.innerHTML = "";

  if (!history.length) {
    renderEmpty();
    return;
  }

  history.forEach(message => {
    createMessage(
      message.role,
      message.content
    );
  });
}

/* إظهار حالة الكتابة */

function showTyping() {
  const element = document.createElement("div");

  element.className = "msg ai typing";

  element.innerHTML =
    '<span></span><span></span><span></span>';

  chat.appendChild(element);

  scrollBottom();

  return element;
}

/* معالجة أخطاء الخادم */

async function readServerResponse(response) {
  const contentType =
    response.headers.get("content-type") || "";

  if (!contentType.includes("application/json")) {
    const body = await response.text();

    throw new Error(
      "الخادم لم يرجع JSON. تحقق من عنوان API وإعدادات Cloudflare. " +
      body.slice(0, 180)
    );
  }

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "حدث خطأ HTTP " + response.status
    );
  }

  if (
    typeof data.reply !== "string" ||
    !data.reply.trim()
  ) {
    throw new Error(
      "الخادم لم يرجع إجابة صحيحة."
    );
  }

  return data;
}

/* إرسال الرسالة */

async function sendMessage(text) {
  if (busy || !text.trim()) return;

  busy = true;

  const requestId = ++activeRequestId;

  activeController = new AbortController();

  sendBtn.disabled = true;
  stopBtn.classList.remove("hidden");

  if (!history.length) {
    chat.innerHTML = "";
  }

  history.push({
    role: "user",
    content: text
  });

  saveHistory();

  createMessage("user", text);

  const typing = showTyping();

  try {

    const messages = history
      .filter(message =>
        message &&
        (
          message.role === "user" ||
          message.role === "assistant"
        ) &&
        typeof message.content === "string"
      )
      .slice(-20);

    /*
      هذا هو تنسيق الطلب الذي يستقبله Worker
      الموجود في مشروعك.
    */

    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: messages
      }),

      signal: activeController.signal,

      cache: "no-store"
    });

    /*
      إيقاف أي نتيجة قديمة إذا تم إلغاء الطلب.
    */

    if (requestId !== activeRequestId) {
      typing.remove();
      return;
    }

    const data = await readServerResponse(response);

    if (requestId !== activeRequestId) {
      typing.remove();
      return;
    }

    typing.remove();

    history.push({
      role: "assistant",
      content: data.reply
    });

    saveHistory();

    createMessage(
      "assistant",
      data.reply
    );

  } catch (error) {

    typing.remove();

    if (
      error.name === "AbortError" ||
      requestId !== activeRequestId
    ) {
      return;
    }

    /*
      حذف رسالة المستخدم التي لم تحصل على رد.
    */

    if (
      history.length &&
      history[history.length - 1].role === "user"
    ) {
      history.pop();
      saveHistory();
    }

    createError(error.message);

  } finally {

    if (requestId === activeRequestId) {
      busy = false;
      activeController = null;

      sendBtn.disabled = false;
      stopBtn.classList.add("hidden");
    }
  }
}

/* إظهار رسالة الخطأ */

function createError(message) {
  const element = document.createElement("div");

  element.className = "msg error";

  element.textContent = "⚠️ " + message;

  chat.appendChild(element);

  scrollBottom();
}

/* إرسال النموذج */

form.addEventListener("submit", event => {
  event.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";
  input.style.height = "48px";

  sendMessage(text);
});

/* إرسال بزر Enter */

input.addEventListener("keydown", event => {
  if (
    event.key === "Enter" &&
    !event.shiftKey &&
    !event.isComposing
  ) {
    event.preventDefault();
    form.requestSubmit();
  }
});

/* تكبير مربع الكتابة */

input.addEventListener("input", () => {
  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";
});

/* إلغاء الطلب */

stopBtn.addEventListener("click", () => {

  if (!busy) return;

  /*
    تغيير رقم الطلب يمنع قبول أي نتيجة قديمة.
  */

  activeRequestId++;

  if (activeController) {
    activeController.abort();
  }

  activeController = null;
  busy = false;

  sendBtn.disabled = false;
  stopBtn.classList.add("hidden");

  createError("تم إيقاف الطلب.");

});

/* محادثة جديدة */

document.getElementById("newChat")
.addEventListener("click", () => {

  if (busy && activeController) {
    activeRequestId++;
    activeController.abort();
  }

  busy = false;
  activeController = null;

  sendBtn.disabled = false;
  stopBtn.classList.add("hidden");

  history = [];

  saveHistory();

  renderEmpty();

  input.focus();
});

/* نافذة الاتصال */

const modal =
  document.getElementById("connectionModal");

document.getElementById("connectionBtn")
.addEventListener("click", () => {
  modal.classList.add("show");
});

document.getElementById("closeModal")
.addEventListener("click", () => {
  modal.classList.remove("show");
});

/* فحص Cloudflare */

async function checkConnection() {
  const status =
    document.getElementById("connectionStatus");

  status.textContent = "⏳ جارٍ فحص الاتصال...";

  try {

    const response = await fetch(API_URL, {
      method: "OPTIONS",
      cache: "no-store"
    });

    if (
      response.ok ||
      response.status === 204
    ) {
      status.textContent =
        "✓ الخادم يستجيب لطلب الفحص.";
    } else {
      status.textContent =
        "⚠️ استجابة الخادم: HTTP " +
        response.status;
    }

  } catch (error) {

    status.textContent =
      "⚠️ تعذر الاتصال. تحقق من الإنترنت وإعدادات Cloudflare.";

  }
}

document.getElementById("checkConnection")
.addEventListener("click", checkConnection);

/* بدء الموقع */

renderHistory();

</script>

</body>
</html>
