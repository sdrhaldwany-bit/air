<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoRestrictions AI</title>

<style>
:root{
--bg:#090d14;
--panel:#111824;
--card:#172131;
--border:#273448;
--green:#65e6ad;
--text:#f0f4fa;
--muted:#8b9aaf;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
height:100dvh;
display:flex;
flex-direction:column;
overflow:hidden
}

header{
height:65px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:#101722;
border-bottom:1px solid var(--border)
}

.logo{
font-size:20px;
font-weight:bold;
color:var(--green)
}

.status{
font-size:12px;
color:var(--green)
}

main{
flex:1;
overflow-y:auto;
width:100%
}

.container{
max-width:850px;
margin:auto;
padding:20px 15px 30px
}

#welcome{
text-align:center;
padding:70px 10px 35px
}

#welcome h1{
font-size:30px;
margin:0 0 12px;
color:var(--green)
}

#welcome p{
color:var(--muted);
line-height:1.8
}

.suggestions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:25px
}

.suggestion{
background:var(--panel);
border:1px solid var(--border);
border-radius:12px;
padding:15px;
color:#dce5f2;
cursor:pointer;
text-align:right
}

.suggestion:hover{
border-color:var(--green)
}

#messages{
display:flex;
flex-direction:column;
gap:18px
}

.message{
max-width:95%;
padding:14px;
border-radius:15px;
line-height:1.8;
overflow-wrap:anywhere
}

.user{
align-self:flex-start;
background:#18392f;
border:1px solid #285b48
}

.ai{
align-self:flex-end;
background:var(--panel);
border:1px solid var(--border);
width:100%
}

.message img{
display:block;
max-width:100%;
max-height:300px;
border-radius:12px;
margin-bottom:10px
}

.message pre{
direction:ltr;
text-align:left;
overflow-x:auto;
white-space:pre;
background:#080c13;
border:1px solid #29364a;
border-radius:0 0 9px 9px;
padding:15px;
margin:0;
font-family:monospace;
font-size:13px
}

.code-header{
direction:ltr;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:7px;
background:#202c3c;
padding:9px 12px;
border-radius:9px 9px 0 0;
font-size:12px;
color:#a9bdd4
}

.code-header button{
background:#34475d;
color:white;
padding:7px 12px;
border-radius:6px;
border:0;
cursor:pointer
}

.code-box{
margin:12px 0;
direction:ltr
}

.save-image-btn{
background:var(--green)!important;
color:#07150f!important;
font-weight:bold
}

.composer-area{
flex-shrink:0;
background:#0d131d;
border-top:1px solid var(--border);
padding:12px
}

.composer{
max-width:850px;
margin:auto;
background:var(--panel);
border:1px solid var(--border);
border-radius:16px;
padding:10px
}

#input{
width:100%;
resize:none;
min-height:48px;
max-height:150px;
background:transparent;
border:0;
outline:0;
color:white;
font-size:16px;
padding:10px;
font-family:Arial
}

.actions{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px
}

.action-left{
display:flex;
gap:8px;
align-items:center
}

button{
cursor:pointer;
border:0;
font-weight:bold
}

.icon-btn{
background:#253246;
color:white;
padding:11px 14px;
border-radius:10px;
font-size:17px
}

.send-btn{
background:var(--green);
color:#07150f;
padding:12px 22px;
border-radius:10px
}

button:disabled{
opacity:.5;
cursor:wait
}

#imageInput{
display:none
}

#imageBtn{
font-size:14px
}

#preview{
display:none;
padding:8px
}

#preview img{
width:75px;
height:75px;
object-fit:cover;
border-radius:10px
}

.preview-actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:8px
}

.preview-actions button{
padding:8px 11px;
border-radius:8px;
background:#253246;
color:white;
font-size:12px
}

#previewName{
display:block;
max-width:220px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.preview-hint{
font-size:11px;
color:var(--muted);
margin-top:7px;
line-height:1.6
}

.typing{
color:var(--muted);
padding:12px;
font-size:13px
}

.footer-note{
text-align:center;
font-size:11px;
color:#64748b;
margin-top:9px;
line-height:1.7
}

@media(max-width:500px){
.container{padding:12px 10px}
#welcome{padding-top:45px}
#welcome h1{font-size:25px}
.suggestions{grid-template-columns:1fr}
.message{max-width:100%}
}
</style>
</head>

<body>

<header>
<div class="logo">✦ NoRestrictions AI</div>
<div class="status" id="status">● جاري الاتصال...</div>
</header>

<main id="main">
<div class="container">

<div id="welcome">
<h1>مرحباً بك 👋</h1>

<p>
أنا NoRestrictions AI<br>
مساعدك للكتابة والبرمجة والأسئلة والمحادثة الطبيعية،
مع إمكانية إرسال الصور وتحليلها.
</p>

<div class="suggestions">

<button class="suggestion"
onclick="suggest('اكتب لي برنامج Python احترافي')">
💻 كتابة الأكواد
</button>

<button class="suggestion"
onclick="suggest('اشرح لي كيف تعمل واجهات API')">
🧠 شرح البرمجة
</button>

<button class="suggestion"
onclick="suggest('صمم لي موقع HTML احترافي')">
🌐 تصميم المواقع
</button>

<button class="suggestion"
onclick="document.getElementById('imageInput').click()">
🖼️ إرسال صورة للتحليل
</button>

</div>
</div>

<div id="messages"></div>

</div>
</main>

<div class="composer-area">

<div class="composer">

<div id="preview">

<img id="previewImg" alt="معاينة الصورة">

<div class="preview-actions">
<span id="previewName" class="preview-hint"></span>

<button type="button" onclick="removeImage()">
إزالة الصورة ✕
</button>
</div>

<div class="preview-hint">
اكتب سؤالك عن الصورة ثم اضغط إرسال.
</div>

</div>

<textarea
id="input"
placeholder="اكتب رسالتك إلى NoRestrictions AI..."
></textarea>

<div class="actions">

<div class="action-left">

<button
type="button"
class="icon-btn"
id="imageBtn"
onclick="document.getElementById('imageInput').click()">
🖼️ الصور
</button>

<input
type="file"
id="imageInput"
accept="image/png,image/jpeg,image/webp"
>

</div>

<button
class="send-btn"
id="sendBtn"
onclick="send()">
إرسال ↑
</button>

</div>
</div>

<div class="footer-note">
NoRestrictions AI · AI Assistant<br>
تُسجّل معلومات الاتصال والمتصفح لأغراض الأمان.
</div>

</div>

<script>
"use strict";

/* إعدادات الخادم */

const API = "https://norestrictions-api.sdrhaldwane.workers.dev";

const $ = id => document.getElementById(id);

let messages = [];
let busy = false;
let selectedImage = null;
let selectedImageUrl = null;

const systemPrompt = `
أنت NoRestrictions AI، مساعد ذكاء اصطناعي عام.

تحدث بشكل طبيعي ومباشر.
أجب بالعربية إذا تحدث المستخدم بالعربية.
اكتب الأكواد كاملة عندما يطلب المستخدم ذلك.
ضع الأكواد داخل كتل Markdown مع تحديد لغة البرمجة.

إذا أرسل المستخدم صورة:
حلّل محتواها بصرياً وأجب عن سؤاله اعتماداً على ما يظهر فيها.

لا تدّع أنك نفذت شيئاً على جهاز المستخدم إذا لم يحدث ذلك فعلاً.
`;


/* تسجيل زيارة الموقع */

(async function registerVisit(){

try{

await fetch(
API + "/visit?page=" + encodeURIComponent(location.pathname),
{
method:"POST"
}
);

}catch(error){

console.error("Visit registration failed");

}

})();


/* اقتراحات البداية */

function suggest(text){

$("input").value = text;
$("input").focus();

}


/* النزول لآخر المحادثة */

function scrollBottom(){

$("main").scrollTop = $("main").scrollHeight;

}


/* إضافة رسالة */

function addMessage(type, content, image = null){

const div = document.createElement("div");

div.className = "message " + type;

if(image){

const img = document.createElement("img");

img.src = image;
img.alt = "الصورة المرسلة";

div.appendChild(img);

}

if(type === "ai"){

renderAI(div, content);

}else{

const text = document.createElement("div");

text.textContent = content;

div.appendChild(text);

}

$("messages").appendChild(div);

scrollBottom();

return div;

}


/* عرض رد الذكاء الاصطناعي والأكواد */

function renderAI(container, text){

const regex = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;

let last = 0;
let match;

while((match = regex.exec(text)) !== null){

if(match.index > last){

const p = document.createElement("div");

p.textContent = text.slice(last, match.index);

container.appendChild(p);

}

const language = match[1] || "CODE";

const codeText = match[2];

const box = document.createElement("div");

box.className = "code-box";

const header = document.createElement("div");

header.className = "code-header";

const lang = document.createElement("span");

lang.textContent = language;

const copy = document.createElement("button");

copy.textContent = "نسخ الكود";

copy.onclick = async () => {

try{

await navigator.clipboard.writeText(codeText);

copy.textContent = "تم النسخ ✓";

setTimeout(() => {
copy.textContent = "نسخ الكود";
},1500);

}catch{

copy.textContent = "تعذر النسخ";

}

};

const save = document.createElement("button");

save.className = "save-image-btn";

save.textContent = "💾 حفظ كصورة";

save.onclick = () => saveCodeAsImage(codeText, language);

const pre = document.createElement("pre");

const code = document.createElement("code");

code.textContent = codeText;

pre.appendChild(code);

header.append(lang, copy, save);

box.append(header, pre);

container.appendChild(box);

last = regex.lastIndex;

}

if(last < text.length){

const p = document.createElement("div");

p.textContent = text.slice(last);

container.appendChild(p);

}

}


/* حفظ الكود كصورة */

function saveCodeAsImage(codeText, language){

const canvas = document.createElement("canvas");

const ctx = canvas.getContext("2d");

const width = 1400;
const padding = 45;
const fontSize = 23;
const lineHeight = 36;

ctx.font = `${fontSize}px monospace`;

const maxWidth = width - padding * 2;

const lines = [];

codeText.split("\n").forEach(line => {

let current = "";

for(const char of line){

const test = current + char;

if(ctx.measureText(test).width > maxWidth && current){

lines.push(current);

current = char;

}else{

current = test;

}

}

lines.push(current);

});

canvas.width = width;

canvas.height = padding * 2 + 75 + lines.length * lineHeight;

ctx.fillStyle = "#090d14";

ctx.fillRect(0,0,width,canvas.height);

ctx.fillStyle = "#65e6ad";

ctx.font = "bold 27px Arial";

ctx.direction = "ltr";

ctx.textAlign = "left";

ctx.fillText("NoRestrictions AI",padding,55);

ctx.fillStyle = "#8b9aaf";

ctx.font = "18px Arial";

ctx.fillText(language.toUpperCase(),width-180,55);

ctx.strokeStyle = "#273448";

ctx.lineWidth = 2;

ctx.beginPath();

ctx.moveTo(padding,80);

ctx.lineTo(width-padding,80);

ctx.stroke();

ctx.font = `${fontSize}px monospace`;

ctx.fillStyle = "#f0f4fa";

lines.forEach((line,index) => {

ctx.fillText(line,padding,125 + index * lineHeight);

});

canvas.toBlob(blob => {

if(!blob){

alert("تعذر إنشاء الصورة");

return;

}

const url = URL.createObjectURL(blob);

const link = document.createElement("a");

link.href = url;

link.download = "NoRestrictions-Code.png";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(() => URL.revokeObjectURL(url),3000);

},"image/png");

}


/* تحويل الصورة إلى Base64 */

function imageToBase64(file){

return new Promise((resolve,reject) => {

const reader = new FileReader();

reader.onload = () => resolve(reader.result);

reader.onerror = () => reject(
new Error("تعذر قراءة الصورة من الجهاز")
);

reader.readAsDataURL(file);

});

}


/* حالة الإرسال */

function setBusy(value,label = "إرسال ↑"){

busy = value;

$("sendBtn").disabled = value;

$("imageBtn").disabled = value;

$("sendBtn").textContent = value ? label : "إرسال ↑";

}


/* اختيار صورة */

$("imageInput").addEventListener("change",event => {

const file = event.target.files && event.target.files[0];

if(!file) return;

if(!/^image\/(png|jpeg|webp)$/.test(file.type)){

alert("اختر صورة PNG أو JPG أو WEBP.");

event.target.value = "";

return;

}

if(file.size > 7 * 1024 * 1024){

alert("حجم الصورة أكبر من 7MB.");

event.target.value = "";

return;

}

selectedImage = file;

if(selectedImageUrl){

URL.revokeObjectURL(selectedImageUrl);

}

selectedImageUrl = URL.createObjectURL(file);

$("previewImg").src = selectedImageUrl;

$("previewName").textContent = file.name;

$("preview").style.display = "block";

$("input").focus();

});


/* إزالة الصورة */

function removeImage(){

selectedImage = null;

$("imageInput").value = "";

$("preview").style.display = "none";

$("previewImg").src = "";

$("previewName").textContent = "";

if(selectedImageUrl){

URL.revokeObjectURL(selectedImageUrl);

}

selectedImageUrl = null;

}


/* استخراج الإجابة من رد الخادم */

function extractAnswer(data){

if(typeof data.reply === "string"){

return data.reply;

}

if(typeof data.message === "string"){

return data.message;

}

if(typeof data.content === "string"){

return data.content;

}

const content = data.choices?.[0]?.message?.content;

if(typeof content === "string"){

return content;

}

if(Array.isArray(content)){

return content
.filter(x => x.type === "text" && x.text)
.map(x => x.text)
.join("\n");

}

return null;

}


/* إرسال الطلب إلى Worker */

async function requestAI(){

/* المسار /chat متوافق مع Worker 17.0 */

const response = await fetch(API + "/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:[
{role:"system",content:systemPrompt},
...messages
]

})

});

let data;

try{

data = await response.json();

}catch{

throw new Error(
"الخادم أرجع استجابة غير مفهومة. تحقق من Worker."
);

}

if(!response.ok || data.success === false){

throw new Error(
data.error || `فشل الاتصال بالخادم HTTP ${response.status}`
);

}

const answer = extractAnswer(data);

if(!answer){

throw new Error(
"وصل رد من الخادم لكن لم أجد نص الإجابة."
);

}

return answer;

}


/* إرسال الرسالة */

async function send(){

if(busy) return;

const text = $("input").value.trim();

if(!text && !selectedImage) return;

setBusy(true,"جارٍ الإرسال...");

$("welcome").style.display = "none";

const imageFile = selectedImage;

$("input").value = "";

$("input").style.height = "auto";

let typing = null;

try{

let content;

if(imageFile){

const dataUrl = await imageToBase64(imageFile);

content = [

{
type:"text",
text:text || "حلّل هذه الصورة واشرح ما يظهر فيها."
},

{
type:"image_url",
image_url:{
url:dataUrl,
detail:"auto"
}

}

];

addMessage(
"user",
text || "حلّل هذه الصورة واشرح ما يظهر فيها.",
dataUrl
);

removeImage();

}else{

content = text;

addMessage("user",text);

}

/* حفظ الرسالة في سجل المحادثة */

messages.push({

role:"user",

content:content

});

/* مؤشر التفكير */

typing = document.createElement("div");

typing.className = "typing";

typing.textContent = "NoRestrictions AI يفكر...";

$("messages").appendChild(typing);

scrollBottom();

/* طلب الإجابة */

const answer = await requestAI();

typing.remove();

typing = null;

messages.push({

role:"assistant",

content:answer

});

addMessage("ai",answer);

}catch(error){

if(typing){

typing.remove();

}

addMessage(
"ai",
"تعذر إكمال الطلب: " + error.message
);

console.error("NoRestrictions chat error:",error);

}finally{

setBusy(false);

scrollBottom();

}

}


/* إرسال بزر Enter */

$("input").addEventListener("keydown",event => {

if(event.key === "Enter" && !event.shiftKey){

event.preventDefault();

send();

}

});


/* تكبير مربع الكتابة تلقائياً */

$("input").addEventListener("input",function(){

this.style.height = "auto";

this.style.height =
Math.min(this.scrollHeight,150) + "px";

});


/* فحص اتصال الخادم */

(async function checkServer(){

try{

const r = await fetch(API + "/health",{

cache:"no-store"

});

$("status").textContent =
r.ok ? "● الخادم متصل" : "● مشكلة بالخادم";

$("status").style.color =
r.ok ? "var(--green)" : "#ff8585";

}catch{

$("status").textContent = "● تعذر الاتصال";

$("status").style.color = "#ff8585";

}

})();

</script>

</body>
</html>
