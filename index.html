<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoRestrictions AI</title><style>
:root{
--bg:#090d14;
--panel:#111824;
--card:#172131;
--border:#273448;
--green:#65e6ad;
--text:#f0f4fa;
--muted:#8b9aaf;
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
height:100dvh;
display:flex;
flex-direction:column;
overflow:hidden;
}
header{
height:65px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:#101722;
border-bottom:1px solid var(--border);
}
.logo{
font-size:20px;
font-weight:bold;
color:var(--green);
}
.status{
font-size:12px;
color:var(--green);
}
main{
flex:1;
overflow-y:auto;
width:100%;
}
.container{
max-width:850px;
margin:auto;
padding:20px 15px 30px;
}
#welcome{
text-align:center;
padding:70px 10px 35px;
}
#welcome h1{
font-size:30px;
margin:0 0 12px;
color:var(--green);
}
#welcome p{
color:var(--muted);
line-height:1.8;
}
.suggestions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:25px;
}
.suggestion{
background:var(--panel);
border:1px solid var(--border);
border-radius:12px;
padding:15px;
color:#dce5f2;
cursor:pointer;
text-align:right;
}
.suggestion:hover{
border-color:var(--green);
}
#messages{
display:flex;
flex-direction:column;
gap:18px;
}
.message{
max-width:95%;
padding:14px;
border-radius:15px;
line-height:1.8;
overflow-wrap:anywhere;
}
.user{
align-self:flex-start;
background:#18392f;
border:1px solid #285b48;
}
.ai{
align-self:flex-end;
background:var(--panel);
border:1px solid var(--border);
width:100%;
}
.message img{
display:block;
max-width:100%;
max-height:300px;
border-radius:12px;
margin-bottom:10px;
}
.message pre{
direction:ltr;
text-align:left;
overflow-x:auto;
white-space:pre;
background:#080c13;
border:1px solid #29364a;
border-radius:10px;
padding:15px;
margin:10px 0;
font-family:monospace;
font-size:13px;
}
.code-header{
direction:ltr;
display:flex;
justify-content:space-between;
align-items:center;
background:#202c3c;
padding:9px 12px;
border-radius:9px 9px 0 0;
font-size:12px;
color:#a9bdd4;
}
.code-header button{
background:#34475d;
color:white;
padding:6px 12px;
border-radius:6px;
border:0;
cursor:pointer;
}
.code-box{
margin:12px 0;
direction:ltr;
}
.code-box pre{
margin:0;
border-radius:0 0 9px 9px;
}
.composer-area{
flex-shrink:0;
background:#0d131d;
border-top:1px solid var(--border);
padding:12px;
}
.composer{
max-width:850px;
margin:auto;
background:var(--panel);
border:1px solid var(--border);
border-radius:16px;
padding:10px;
}
#input{
width:100%;
resize:none;
min-height:48px;
max-height:150px;
background:transparent;
border:0;
outline:0;
color:white;
font-size:16px;
padding:10px;
font-family:Arial;
}
.actions{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}
.action-left{
display:flex;
gap:8px;
align-items:center;
}
button{
cursor:pointer;
border:0;
font-weight:bold;
}
.icon-btn{
background:#253246;
color:white;
padding:11px 14px;
border-radius:10px;
font-size:17px;
}
.send-btn{
background:var(--green);
color:#07150f;
padding:12px 22px;
border-radius:10px;
}
button:disabled{
opacity:.5;
cursor:wait;
}
#imageInput{
display:none;
}
#preview{
display:none;
padding:8px;
}
#preview img{
width:75px;
height:75px;
object-fit:cover;
border-radius:10px;
}
#preview button{
background:#a33e3e;
color:white;
padding:7px;
border-radius:7px;
}
.typing{
color:var(--muted);
padding:12px;
font-size:13px;
}
.footer-note{
text-align:center;
font-size:11px;
color:#64748b;
margin-top:9px;
}
@media(max-width:500px){
.container{padding:12px 10px}
#welcome{padding-top:45px}
#welcome h1{font-size:25px}
.suggestions{grid-template-columns:1fr}
.message{max-width:100%}
}
</style></head><body><header>
<div class="logo">✦ NoRestrictions AI</div>
<div class="status" id="status">● متصل</div>
</header><main id="main">
<div class="container"><div id="welcome">
<h1>مرحباً بك 👋</h1>
<p>
أنا NoRestrictions AI<br>
اسألني، اطلب مني كتابة الأكواد، أو أرسل صورة لتحليلها.
</p><div class="suggestions">
<button class="suggestion" onclick="suggest('اكتب لي برنامج Python احترافي')">
💻 كتابة الأكواد
</button>
<button class="suggestion" onclick="suggest('اشرح لي كيف تعمل واجهات API')">
🧠 شرح البرمجة
</button>
<button class="suggestion" onclick="suggest('صمم لي موقع HTML احترافي')">
🌐 تصميم المواقع
</button>
<button class="suggestion" onclick="suggest('ساعدني في تحليل صورة')">
🖼️ تحليل الصور
</button>
</div>
</div><div id="messages"></div></div>
</main><div class="composer-area"><div class="composer"><div id="preview">
<img id="previewImg">
<button onclick="removeImage()">إزالة الصورة</button>
</div><textarea id="input" placeholder="اكتب رسالتك إلى NoRestrictions AI..."></textarea><div class="actions"><div class="action-left">
<label for="imageInput" class="icon-btn">📎</label>
<input type="file" id="imageInput" accept="image/*">
</div><button class="send-btn" id="sendBtn" onclick="send()">
إرسال ↑
</button></div>
</div><div class="footer-note">
NoRestrictions AI · AI Assistant
</div></div><script>
const API="https://norestrictions-api.sdrhaldwane.workers.dev";

const $=id=>document.getElementById(id);

let messages=[];
let busy=false;
let selectedImage=null;

const systemPrompt=`
أنت NoRestrictions AI، مساعد ذكاء اصطناعي عام ومتخصص في البرمجة.

قواعد مهمة:

1. عندما يطلب المستخدم كتابة كود، اكتب الكود كاملاً مباشرة داخل ردك.
2. لا تقل إنك سترسل الكود إلى Termux أو ستنفذه على جهاز المستخدم.
3. لا تستخدم نظام المهام أو أوامر NR_TASK.
4. لا تدّع أنك نفذت برنامجاً على جهاز المستخدم.
5. اعرض الأكواد داخل Markdown code blocks مع تحديد لغة البرمجة.
6. إذا طلب المستخدم مشروعاً كاملاً، اكتب الملفات المطلوبة ومحتوياتها.
7. أجب عن الأسئلة المتعلقة بالصور المرسلة وحلل محتواها.
8. استخدم اللغة العربية عند التحدث مع المستخدم بالعربية.
9. لا تختصر الأكواد عندما يطلب المستخدم كوداً كاملاً.
10. كن واضحاً ومنظماً ومباشراً.
`;

function suggest(text){
$("input").value=text;
$("input").focus();
}

function addMessage(type,content,image=null){

const div=document.createElement("div");
div.className="message "+type;

if(image){
const img=document.createElement("img");
img.src=image;
div.appendChild(img);
}

if(type==="ai"){
renderAI(div,content);
}else{
const text=document.createElement("div");
text.textContent=content;
div.appendChild(text);
}

$("messages").appendChild(div);
scrollBottom();

}

function renderAI(container,text){

// تقسيم الرد إلى أجزاء نصية وأكواد

const regex=/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;

let last=0;
let match;

while((match=regex.exec(text))!==null){

if(match.index>last){
const p=document.createElement("div");
p.textContent=text.slice(last,match.index);
container.appendChild(p);
}

const box=document.createElement("div");
box.className="code-box";

const header=document.createElement("div");
header.className="code-header";

const language=document.createElement("span");
language.textContent=match[1]||"CODE";

const copy=document.createElement("button");
copy.textContent="نسخ الكود";

const pre=document.createElement("pre");
const code=document.createElement("code");

code.textContent=match[2];
pre.appendChild(code);

copy.onclick=async()=>{
try{
await navigator.clipboard.writeText(match[2]);
copy.textContent="تم النسخ ✓";
setTimeout(()=>copy.textContent="نسخ الكود",1500);
}catch{
copy.textContent="تعذر النسخ";
}
};

header.append(language,copy);
box.append(header,pre);
container.appendChild(box);

last=regex.lastIndex;
}

if(last<text.length){
const p=document.createElement("div");
p.textContent=text.slice(last);
container.appendChild(p);
}

}

function scrollBottom(){
$("main").scrollTop=$("main").scrollHeight;
}

async function requestAI(){

const payload={
messages:[
{role:"system",content:systemPrompt},
...messages
]
};

const response=await fetch(API+"/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"HTTP "+response.status);
}

const content=
data.choices?.[0]?.message?.content||
data.reply||
data.message;

if(typeof content==="string")return content;

if(Array.isArray(content)){
return content
.filter(x=>x.type==="text")
.map(x=>x.text)
.join("\n");
}

throw new Error("لم يصل رد مفهوم من النموذج");
}

function imageToBase64(file){
return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>resolve(reader.result);
reader.onerror=()=>reject(new Error("تعذر قراءة الصورة"));

reader.readAsDataURL(file);

});
}

$("imageInput").addEventListener("change",event=>{

const file=event.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){
alert("اختر صورة صحيحة");
return;
}

if(file.size>10*1024*1024){
alert("حجم الصورة أكبر من 10MB");
return;
}

selectedImage=file;

$("previewImg").src=URL.createObjectURL(file);
$("preview").style.display="block";

});

function removeImage(){

selectedImage=null;
$("imageInput").value="";
$("preview").style.display="none";
$("previewImg").src="";

}

async function send(){

if(busy)return;

const text=$("input").value.trim();

if(!text&&!selectedImage)return;

busy=true;
$("sendBtn").disabled=true;
$("sendBtn").textContent="جارٍ الإرسال...";

$("welcome").style.display="none";

const image=selectedImage;

$("input").value="";

try{

let content;

if(image){

const base64=await imageToBase64(image);

content=[
{
type:"text",
text:text||"حلل هذه الصورة."
},
{
type:"image_url",
image_url:{url:base64}
}
];

addMessage(
"user",
text||"حلل هذه الصورة",
URL.createObjectURL(image)
);

removeImage();

}else{

content=text;
addMessage("user",text);

}

messages.push({
role:"user",
content
});

const typing=document.createElement("div");
typing.className="typing";
typing.textContent="NoRestrictions AI يفكر...";
$("messages").appendChild(typing);

const answer=await requestAI();

typing.remove();

messages.push({
role:"assistant",
content:answer
});

addMessage("ai",answer);

}catch(error){

addMessage("ai","حدث خطأ أثناء الاتصال:\n"+error.message);
console.error(error);

}finally{

busy=false;
$("sendBtn").disabled=false;
$("sendBtn").textContent="إرسال ↑";

scrollBottom();

}

}

$("input").addEventListener("keydown",event=>{

if(event.key==="Enter"&&!event.shiftKey){
event.preventDefault();
send();
}

});

$("input").addEventListener("input",function(){
this.style.height="auto";
this.style.height=Math.min(this.scrollHeight,150)+"px";
});

</script></body>
</html>
